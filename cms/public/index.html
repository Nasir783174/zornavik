<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zornavik Studio</title>
  <link rel="icon" type="image/png" href="/zornavik.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/_cms/app.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="rail" id="rail">
      <a class="brand" href="#/posts"><span class="brand-mark">Z</span><span class="brand-text">Zornavik<small>Studio</small></span></a>
      <nav class="rail-nav" id="rail-nav">
        <a href="#/posts" data-nav="posts"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h5"/></svg>Posts</a>
        <a href="#/new" data-nav="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add new post</a>
        <a href="#/categories" data-nav="categories"><svg viewBox="0 0 24 24"><path d="M4 6h7v7H4zM13 6h7v7h-7zM4 15h7v3H4zM13 15h7v3h-7z"/></svg>Categories</a>
        <a href="#/media" data-nav="media"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/><circle cx="9" cy="10" r="1.5"/><path d="M4 17l5-4 4 3 3-2 4 3"/></svg>Media</a>
        <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>Settings</a>
      </nav>
      <div class="rail-foot">
        <a id="site-link" href="#" target="_blank" rel="noopener">Open local site ↗</a>
        <button id="rebuild-btn" type="button" class="link-btn" title="Regenerate list pages, menus and sitemap">Rebuild site pages</button>
      </div>
    </aside>
    <main class="view" id="view"></main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-root" id="modal-root"></div>

  <script src="/_cms/tinymce/tinymce.min.js"></script>
  <script src="/_cms/app.js"></script>
</body>
</html>
